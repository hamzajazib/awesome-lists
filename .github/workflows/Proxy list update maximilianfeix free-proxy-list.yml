name: Proxy maximilianfeix free-proxy-list Update

on:
  schedule:
    - cron: '30 * * * *'  # Runs every hour (the list is republished at about 20 past the hour)
  workflow_dispatch:

jobs:
  fetch-maximilianfeix-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all.txt File from maximilianfeix/free-proxy-list
        run: |
          # Define the target directory
          TARGET_DIR=Lists/PROXY/maximilianfeix_free-proxy-list
          mkdir -p $TARGET_DIR

          # Every entry passed a protocol handshake, a honeypot check and a content check in the last hourly run
          URL="https://raw.githubusercontent.com/maximilianfeix/free-proxy-list/refs/heads/main/all.txt"
          echo "Downloading all.txt from $URL"
          curl -fL -o "$TARGET_DIR/all.txt" "$URL" || echo "Failed to download all.txt"

      - name: create lookup
        run: |
          cd Lists/PROXY/maximilianfeix_free-proxy-list
          python3 create_lookup_file.py

      - name: List files in the target directory
        run: ls -la Lists/PROXY/maximilianfeix_free-proxy-list

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/PROXY/maximilianfeix_free-proxy-list/*
          git commit -m "Update hourly maximilianfeix free-proxy-list files" --allow-empty
          git push
